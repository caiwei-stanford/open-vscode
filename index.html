<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Open in VS Code</title>
<style>
  :root { --fg: #1f2328; --bg: #ffffff; --code: #f6f8fa; --accent: #0969da; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --bg: #0d1117; --code: #161b22; --accent: #2f81f7; } }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); max-width: 40rem; margin: 3rem auto; padding: 0 16px; }
  code { background: var(--code); padding: 0.1rem 0.3rem; border-radius: 4px; word-break: break-all; }
  a.button { display: inline-block; padding: 0.5rem 1rem; border-radius: 6px; background: var(--accent); color: #ffffff; text-decoration: none; }
</style>
</head>
<body>
<h1>Open in VS Code</h1>
<p id="msg">This page opens a folder on your own computer in VS Code. Link to it as <code>https://caiwei-stanford.github.io/open-vscode/#/absolute/path/to/folder</code>.</p>
<p><a id="go" class="button" hidden>Open in VS Code</a></p>
<script src="open.js"></script>
